<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không Tìm Thấy Trang | SFMS Arena</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-grid-pattern {
      background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .animate-float {
      animation: float 3.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased bg-grid-pattern min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

  <div class="w-full max-w-lg bg-white rounded-3xl border border-slate-200 shadow-2xl p-8 sm:p-10 relative overflow-hidden text-center">

    <!-- Glow Effect phía trên bên phải -->
    <div class="absolute -top-12 -right-12 w-36 h-36 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -left-12 w-36 h-36 bg-teal-500/10 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Header / Brand Logo -->
    <div class="mb-6">
      <a href="/" class="inline-flex items-center gap-2.5 group">
        <div class="w-11 h-11 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-2xl flex items-center justify-center text-white shadow-md shadow-emerald-500/20 group-hover:scale-105 transition duration-300">
          <i class="fa-solid fa-bolt-lightning text-lg"></i>
        </div>
        <span class="text-2xl font-black tracking-tight text-slate-900">SFMS<span class="text-emerald-600">.</span></span>
      </a>
    </div>

    <!-- Minh họa 404 phong cách thể thao -->
    <div class="relative my-6 flex items-center justify-center">
      <span class="text-8xl sm:text-9xl font-black text-slate-100 select-none tracking-widest">404</span>

      <!-- Mascot / Quả bóng lệch vị trí -->
      <div class="absolute flex flex-col items-center animate-float">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 text-white flex items-center justify-center shadow-xl shadow-emerald-500/25">
          <i class="fa-solid fa-futbol text-3xl"></i>
        </div>
        <span class="mt-2 text-[11px] font-bold uppercase tracking-wider text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-full shadow-sm">
          Bóng đi hết đường biên
        </span>
      </div>
    </div>

    <!-- Tiêu đề & Lời nhắn -->
    <h1 class="text-xl sm:text-2xl font-black text-slate-900 mb-2">Đường dẫn không tồn tại!</h1>
    <p class="text-xs sm:text-sm text-slate-500 leading-relaxed max-w-sm mx-auto mb-6">
      Trang bạn tìm kiếm có thể đã bị xóa, đổi tên hoặc đường link vừa nhập chưa chính xác trên hệ thống sân.
    </p>

    <!-- Khối hiển thị URI bị gõ nhầm -->
    <div class="bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 mb-6 flex items-center justify-center gap-2 text-xs font-mono text-slate-500 break-all">
      <i class="fa-solid fa-link-slash text-slate-400"></i>
      <span id="badUrlPath">Đang kiểm tra...</span>
    </div>

    <!-- Các nút hành động chính -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <button onclick="history.back()" class="py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs sm:text-sm rounded-xl transition duration-200 flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Quay lại
      </button>

      <a href="/" class="py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs sm:text-sm rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200 flex items-center justify-center gap-2">
        <i class="fa-solid fa-house"></i> Về trang chủ
      </a>
    </div>

    <!-- Hỗ trợ / Footer -->
    <div class="mt-8 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
      <a href="/admin/schedule.html" class="hover:text-emerald-600 transition flex items-center gap-1.5 font-semibold">
        <i class="fa-solid fa-gauge-high"></i> Vào trang Quản trị
      </a>
      <span class="flex items-center gap-1">
        <i class="fa-solid fa-headset text-emerald-500"></i> Hotline: 1900 6868
      </span>
    </div>

  </div>

  <script>
    // Lấy chính xác đường dẫn bị 404 trên thanh URL để người dùng nhận biết
    document.getElementById('badUrlPath').textContent = window.location.pathname || 'Đường dẫn không xác định';
  </script>
</body>
</html>
