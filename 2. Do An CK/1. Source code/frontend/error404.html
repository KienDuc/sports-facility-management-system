<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không Tìm Thấy Trang | SFMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-sans text-gray-800 antialiased">

    <div class="max-w-md w-full text-center bg-white rounded-2xl shadow-xl p-8 md:p-10 border border-gray-100 transition-all">
        <!-- Biểu tượng minh họa -->
        <div class="relative w-28 h-28 mx-auto mb-6 flex items-center justify-center bg-green-50 rounded-full">
            <i class="fa-solid fa-futbol text-green-500 text-5xl animate-bounce"></i>
            <span class="absolute -bottom-1 -right-1 bg-red-500 text-white text-xs font-extrabold px-2.5 py-1 rounded-full border-2 border-white shadow-sm">
                404
            </span>
        </div>

        <!-- Tiêu đề & Thông điệp -->
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Đường bóng đi ra ngoài!</h1>
        <p class="text-gray-500 text-sm mb-6 leading-relaxed">
            Trang bạn đang tìm kiếm không tồn tại, đã bị đổi tên hoặc đường dẫn truy cập bị sai lệch.
        </p>

        <!-- Khối hiển thị URL lỗi thực tế -->
        <div class="bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 mb-6 flex items-center justify-center gap-2 text-xs font-mono text-gray-600 break-all">
            <i class="fa-solid fa-link-slash text-gray-400"></i>
            <span id="requestedPath">Đang kiểm tra...</span>
        </div>

        <!-- Nhóm nút điều hướng -->
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="history.back()" class="w-full sm:w-1/2 flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 px-4 rounded-xl transition text-sm">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </button>
            <a href="/admin/schedule.html" class="w-full sm:w-1/2 flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md transition text-sm">
                <i class="fa-solid fa-house"></i> Về trang chủ
            </a>
        </div>

        <!-- Footer hỗ trợ -->
        <div class="mt-8 pt-6 border-t border-gray-100 text-xs text-gray-400">
            Hệ Thống Quản Lý Đặt Sân &bull; SFMS Admin
        </div>
    </div>

    <script>
        // Hiển thị đường dẫn bị gõ sai trực tiếp từ thanh địa chỉ
        document.getElementById('requestedPath').textContent = window.location.pathname || 'Không xác định';
    </script>
</body>
</html>
