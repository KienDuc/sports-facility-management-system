<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn Đặt - Elite Sport Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 overflow-hidden">
    <div class="flex h-screen w-full">
        <!-- SIDEBAR CHUNG -->
        <admin-sidebar></admin-sidebar>

        <div class="flex-1 flex flex-col h-screen min-w-0">
            <!-- HEADER CHUNG -->
            <admin-header title="Quản lý Đơn Đặt"></admin-header>

            <!-- VÙNG NỘI DUNG CHÍNH (GIỮ NGUYÊN HOÀN TOÀN) -->
            <main class="flex-1 bg-gray-50 overflow-y-auto p-6 relative">
                <div class="max-w-full mx-auto bg-white p-6 rounded-lg shadow-md">
                    <!-- HEADER -->
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-xl font-bold text-gray-800 uppercase">
                            <i class="fa-solid fa-clipboard-list mr-2 text-emerald-600"></i>Quản lý Đơn Đặt
                        </h1>
                        <button onclick="fetchAndRenderBookings()" class="w-24 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 px-4 rounded shadow-sm transition">
<!--                            <i class="fa-solid fa-rotate-right mr-1"></i> -->
                            Làm mới
                        </button>
                    </div>

                    <!-- THANH TRA CỨU / BỘ LỌC -->
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-5">
                        <form id="searchForm" onsubmit="searchBookings(event)" class="flex flex-wrap items-end gap-3">
                            <div class="flex flex-col flex-1 min-w-[220px]">
                                <label class="text-sm font-medium text-gray-500 mb-1">Tra cứu (Mã đơn / Tên KH / SĐT)</label>
                                <input type="text" id="filterKeyword" placeholder="BK1755... hoặc Nguyễn Văn A hoặc 09xx..."
                                       class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                            </div>

                            <div class="flex flex-col">
                                <label class="text-sm font-medium text-gray-500 mb-1">Trạng thái</label>
                                <select id="filterStatus" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-blue-500 font-medium cursor-pointer">
                                    <option value="all">-- Tất cả --</option>
                                    <option value="booked">Đã đặt trước</option>
                                    <option value="playing">Đang chơi</option>
                                    <option value="canceled">Đã hủy / Hoàn tất</option>
                                </select>
                            </div>

                            <div class="flex flex-col">
                                <label class="text-sm font-medium text-gray-500 mb-1">Từ ngày</label>
                                <input type="date" id="filterDateFrom" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-blue-500 cursor-pointer">
                            </div>

                            <div class="flex flex-col">
                                <label class="text-sm font-medium text-gray-500 mb-1">Đến ngày</label>
                                <input type="date" id="filterDateTo" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-blue-500 cursor-pointer">
                            </div>

                            <div class="flex gap-2">
                                <button type="submit" class="w-24 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-3 rounded-md shadow transition">
<!--                                    <i class="fa-solid fa-magnifying-glass mr-1"></i> -->
                                    Tìm kiếm
                                </button>
                                <button type="button" onclick="resetFilters()" class="w-24 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium py-2 px-3 rounded-md shadow-sm transition">
                                    Xóa lọc
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- BẢNG DANH SÁCH -->
                    <div class="rounded-lg border border-gray-200 shadow-sm flex flex-col">
                        <div class="overflow-x-auto">
                            <table class="min-w-full bg-white text-sm">
                                <thead>
                                    <tr class="bg-gray-50 border-b text-left font-medium text-gray-600">
                                        <th class="py-3 px-4 w-16 text-sm font-medium">ID</th>
                                        <th class="py-3 px-6 text-sm font-medium">Mã Đơn</th>
                                        <th class="py-3 px-6 text-sm font-medium">Khách Hàng</th>
                                        <th class="py-3 px-6 text-sm font-medium">SĐT</th>
                                        <th class="py-3 px-6 text-sm font-medium">Ngày Đặt</th>
                                        <th class="py-3 px-6 text-sm font-medium">Sân / Khung Giờ</th>
                                        <th class="py-3 px-6 text-sm font-medium">Tổng Tiền</th>
                                        <th class="py-3 px-6 text-center text-sm font-medium">Trạng Thái</th>
                                        <th class="py-3 px-6 text-center w-28 text-sm font-medium">Thao Tác</th>
                                    </tr>
                                </thead>
                                <tbody id="booking-list"></tbody>
                            </table>
                        </div>

                        <!-- KHU VỰC PHÂN TRANG -->
                        <div class="flex justify-between items-center p-4 border-t border-gray-200 bg-gray-50 rounded-b-lg">
                            <span id="page-info" class="text-sm text-gray-600 font-medium"></span>
                            <div class="flex space-x-2">
                                <button onclick="prevPage()" class="w-24 px-4 py-1.5 bg-white border border-gray-300 hover:bg-gray-100 rounded shadow-sm text-sm font-medium transition text-gray-700">Trước</button>
                                <button onclick="nextPage()" class="w-24 px-4 py-1.5 bg-white border border-gray-300 hover:bg-gray-100 rounded shadow-sm text-sm font-medium transition text-gray-700">Sau</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- MODAL: CHI TIẾT ĐƠN ĐẶT -->
                <div id="detailModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 overflow-y-auto h-full w-full z-50 flex items-center justify-center backdrop-blur-sm">
                    <div class="p-6 border w-[480px] max-h-[85vh] overflow-y-auto shadow-xl rounded-xl bg-white">
                        <div class="flex justify-between items-center border-b pb-3 mb-4">
                            <h3 class="text-lg font-bold text-gray-800">Chi Tiết Đơn Đặt</h3>
                            <button onclick="closeDetailModal()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>

                        <div class="space-y-2 text-sm text-gray-600 mb-4">
                            <div class="flex justify-between"><span class="font-medium">Mã Đơn:</span> <span id="detailCode" class="font-bold text-blue-600"></span></div>
                            <div class="flex justify-between"><span class="font-medium">Khách hàng:</span> <span id="detailName" class="font-medium text-gray-900"></span></div>
                            <div class="flex justify-between"><span class="font-medium">SĐT:</span> <span id="detailPhone" class="font-medium text-gray-900"></span></div>
                            <div class="flex justify-between"><span class="font-medium">Ngày đặt:</span> <span id="detailDate" class="font-medium text-gray-900"></span></div>
                            <div class="flex justify-between"><span class="font-medium">Thời gian tạo:</span> <span id="detailCreatedAt" class="font-medium text-gray-900"></span></div>
                            <div class="flex justify-between items-center"><span class="font-medium">Trạng thái:</span> <span id="detailStatus" class="px-2 py-0.5 rounded text-xs font-bold"></span></div>
                            <div class="flex justify-between"><span class="font-medium">Tổng tiền:</span> <span id="detailTotal" class="font-bold text-red-500"></span></div>
                            <div id="detailNoteWrap" class="pt-1"><span class="font-medium">Ghi chú:</span> <span id="detailNote" class="text-gray-700"></span></div>
                        </div>

                        <div class="mb-4">
                            <h4 class="text-sm font-bold text-gray-700 mb-2 border-t pt-3"><i class="fa-solid fa-vector-square mr-1 text-blue-500"></i>Sân &amp; Khung Giờ</h4>
                            <table class="w-full text-xs border border-gray-200 rounded overflow-hidden">
                                <thead class="bg-gray-50 text-gray-600">
                                    <tr>
                                        <th class="py-2 px-2 text-left">Sân</th>
                                        <th class="py-2 px-2 text-left">Khung Giờ</th>
                                        <th class="py-2 px-2 text-right">Giá</th>
                                    </tr>
                                </thead>
                                <tbody id="detailSlots"></tbody>
                            </table>
                        </div>

                        <div class="mb-2">
                            <h4 class="text-sm font-bold text-gray-700 mb-2 border-t pt-3"><i class="fa-solid fa-concierge-bell mr-1 text-blue-500"></i>Dịch Vụ Đi Kèm</h4>
                            <table class="w-full text-xs border border-gray-200 rounded overflow-hidden">
                                <thead class="bg-gray-50 text-gray-600">
                                    <tr>
                                        <th class="py-2 px-2 text-left">Dịch vụ</th>
                                        <th class="py-2 px-2 text-center">SL</th>
                                        <th class="py-2 px-2 text-right">Thành tiền</th>
                                    </tr>
                                </thead>
                                <tbody id="detailServices"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Nạp Layout & Logic JS -->
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/admin/assets/js/layout.js"></script>
    <script src="/admin/assets/js/bookings.js"></script>
</body>
</html>
