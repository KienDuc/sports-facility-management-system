<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - SFMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4 font-sans">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-futbol text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">SFMS Admin</h1>
            <p class="text-sm text-gray-500 mt-1">Vui lòng đăng nhập để vào bảng điều khiển</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div id="errorAlert" class="hidden p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200"></div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tên đăng nhập</label>
                <input type="text" id="username" required class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-green-500 outline-none" placeholder="admin">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Mật khẩu</label>
                <input type="password" id="password" required class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-green-500 outline-none" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg shadow-sm transition">
                Đăng Nhập
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/" class="text-sm text-gray-500 hover:text-gray-800 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại trang khách
            </a>
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.classList.add('hidden');

            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            // Xử lý gọi API Login (Demo hoặc API OAuth2 Password Request)
            try {
                // Giả lập hoặc gọi thẳng API backend của bạn
                localStorage.setItem("access_token", "admin_demo_token_123");
                window.location.replace("/admin/schedule.html");
            } catch (err) {
                errorAlert.textContent = "Sai thông tin đăng nhập!";
                errorAlert.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
