<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Hệ Thống - SportHub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-grid-pattern {
      background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased bg-grid-pattern min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200 shadow-2xl p-8 sm:p-10 relative overflow-hidden">

    <!-- Glow Effect -->
    <div class="absolute -top-12 -right-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Header / Brand -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2.5 mb-3 group">
<!--        <div class="w-11 h-11 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-2xl flex items-center justify-center text-white shadow-md shadow-emerald-500/20 group-hover:scale-105 transition">-->
<!--          <i class="fa-solid fa-bolt-lightning text-lg"></i>-->
<!--        </div>-->
        <div class="flex flex-col items-center animate-float">
          <div class="w-11 h-11 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-2xl flex items-center justify-center text-white shadow-md shadow-emerald-500/20 group-hover:scale-105 transition duration-300">
            <i class="fa-solid fa-futbol text-2xl"></i>
          </div>
        </div>
        <span class="text-2xl font-black tracking-tight text-slate-900">SFMS<span class="text-emerald-600">.</span></span>
      </a>
      <h1 class="text-xl font-black text-slate-900">Đăng Nhập Hệ Thống</h1>
      <p class="text-xs text-slate-500 mt-1">Truy cập bảng điều khiển và quản lý trung tâm thể thao</p>
    </div>

    <!-- Login Form -->
    <form method="POST" action="/login" class="space-y-5">

      <!-- Username / Account -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Tài khoản / Tên đăng nhập</label>
        <div class="relative">
          <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input
            type="text"
            name="username"
            required
            placeholder="Nhập tên tài khoản..."
            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:outline-emerald-600 transition"
          >
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Mật khẩu</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input
            type="password"
            id="passwordInput"
            name="password"
            required
            placeholder="Nhập mật khẩu..."
            class="w-full pl-11 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:outline-emerald-600 transition"
          >
          <button
            type="button"
            onclick="togglePasswordVisibility()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1"
          >
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- Remember Me -->
      <div class="flex items-center text-xs">
        <label class="flex items-center gap-2 cursor-pointer font-medium text-slate-600 select-none">
          <input type="checkbox" name="remember" checked class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
          <span>Ghi nhớ phiên đăng nhập</span>
        </label>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200 flex items-center justify-center gap-2"
      >
        <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
      </button>
    </form>

    <!-- Back to Home -->
    <div class="text-center mt-6 pt-4 border-t border-slate-100">
      <a href="/" class="text-xs font-bold text-slate-400 hover:text-emerald-600 transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ
      </a>
    </div>

  </div>

  <!-- Toggle Password Script -->
  <script>
    function togglePasswordVisibility() {
      const pass = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        pass.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }
  </script>
</body>
</html>
