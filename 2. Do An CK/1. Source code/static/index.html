<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test System Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4 text-primary">⚽ Test Đặt Sân Thể Thao</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title mb-3">Thêm Sân Mới</h5>
                    <form id="courtForm">
                        <div class="mb-3">
                            <label class="form-label">Tên sân</label>
                            <input type="text" id="name" class="form-control" placeholder="Sân A1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Loại sân</label>
                            <select id="type" class="form-select" required>
                                <option value="Bóng đá">Bóng đá</option>
                                <option value="Cầu lông">Cầu lông</option>
                                <option value="Tennis">Tennis</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giá/Giờ (VNĐ)</label>
                            <input type="number" id="price" class="form-control" value="150000" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Lưu Sân</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title mb-3">Danh Sách Sân Real-time</h5>
                    <table class="table table-bordered align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Tên Sân</th>
                                <th>Loại</th>
                                <th>Giá/Giờ</th>
                            </tr>
                        </thead>
                        <tbody id="courtList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "/api/v1/courts/";

        async function loadCourts() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const tbody = document.getElementById("courtList");
            tbody.innerHTML = data.map(c => `
                <tr>
                    <td>#${c.id}</td>
                    <td>${c.name}</td>
                    <td><span class="badge bg-info text-dark">${c.type}</span></td>
                    <td class="text-success fw-bold">${c.price_per_hour.toLocaleString()} đ</td>
                </tr>
            `).join("");
        }

        document.getElementById("courtForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById("name").value,
                type: document.getElementById("type").value,
                price_per_hour: parseFloat(document.getElementById("price").value)
            };
            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            document.getElementById("courtForm").reset();
            loadCourts();
        });

        loadCourts();
    </script>
</body>
</html>
