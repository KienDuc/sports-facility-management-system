<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

    <div class="max-w-full mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-gray-800">
                <i class="fa-solid fa-layer-group mr-2 text-blue-600"></i>Danh Sách Sân
            </h1>
            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 px-4 rounded shadow transition">
                + Thêm Sân Mới
            </button>
        </div>

        <div class="rounded-lg border border-gray-200 shadow-sm flex flex-col">
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b text-left font-semibold text-gray-600">
                            <th class="py-3 px-4 w-16">ID</th>
                            <th class="py-3 px-6">Tên Sân</th>
                            <th class="py-3 px-6 w-32">Loại</th>
                            <th class="py-3 px-6 w-40">Giá/Giờ</th>
                            <th class="py-3 px-6 text-center w-32">Hoạt Động</th>
                            <th class="py-3 px-6 text-center w-24">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="court-list">

                    </tbody>
                </table>
            </div>

            <!-- KHU VỰC PHÂN TRANG -->
            <div class="flex justify-between items-center p-4 border-t border-gray-200 bg-gray-50 rounded-b-lg">
                <span id="page-info" class="text-sm text-gray-600 font-medium"></span>
                <div class="flex space-x-2">
                    <button onclick="prevPage()" class="px-4 py-1.5 bg-white border border-gray-300 hover:bg-gray-100 rounded shadow-sm text-sm font-semibold transition text-gray-700">Trước</button>
                    <button onclick="nextPage()" class="px-4 py-1.5 bg-white border border-gray-300 hover:bg-gray-100 rounded shadow-sm text-sm font-semibold transition text-gray-700">Sau</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM SÂN MỚI -->
    <div id="addCourtModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="p-6 border w-96 shadow-xl rounded-xl bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-bold text-gray-900 mb-4">Thêm Sân Thể Thao Mới</h3>
                <form id="addCourtForm" onsubmit="submitNewCourt(event)" class="text-left">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tên Sân</label>
                        <input type="text" id="addCourtName" required class="w-full border border-gray-300 rounded-md py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Loại Sân</label>
                        <select id="addCourtType" class="w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm focus:ring-blue-500 font-medium">
                            <option value="Bóng đá">Bóng đá</option>
                            <option value="Cầu lông">Cầu lông</option>
                            <option value="Tennis">Tennis</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Giá thuê (VNĐ/Giờ)</label>
                        <input type="number" id="addCourtPrice" required min="1" class="w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm focus:ring-blue-500">
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeAddModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg shadow-sm transition">Hủy</button>
                        <button type="submit" id="btnAddSubmit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition">Lưu Sân</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL SỬA SÂN -->
    <div id="editCourtModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="p-6 border w-96 shadow-xl rounded-xl bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-bold text-gray-900 mb-4">Chỉnh Sửa Thông Tin Sân</h3>
                <form id="editCourtForm" onsubmit="submitEditCourt(event)" class="text-left">
                    <input type="hidden" id="editCourtId">

                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tên Sân</label>
                        <input type="text" id="editCourtName" required class="w-full border border-gray-300 rounded-md py-2 px-3 focus:ring-blue-500 sm:text-sm">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Loại Sân</label>
                        <select id="editCourtType" class="w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm focus:ring-blue-500 font-medium">
                            <option value="Bóng đá">Bóng đá</option>
                            <option value="Cầu lông">Cầu lông</option>
                            <option value="Tennis">Tennis</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Giá thuê (VNĐ/Giờ)</label>
                        <input type="number" id="editCourtPrice" required min="1" class="w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm focus:ring-blue-500">
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeEditModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg shadow-sm transition">Hủy</button>
                        <button type="submit" id="btnEditSubmit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition">Cập Nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script>
    // --- CẤU HÌNH BIẾN TOÀN CỤC CHO PHÂN TRANG ---
    const API_URL = 'http://127.0.0.1:8000/api/v1/courts/';
    let allCourtsData = [];
    let currentPage = 1;
    const rowsPerPage = 8;

    // --- MODAL THÊM ---
    function openAddModal() { document.getElementById('addCourtModal').classList.remove('hidden'); }
    function closeAddModal() {
        document.getElementById('addCourtModal').classList.add('hidden');
        document.getElementById('addCourtForm').reset();
    }

    // --- MODAL SỬA ---
    function openEditModal(id, name, type, price) {
        document.getElementById('editCourtId').value = id;
        document.getElementById('editCourtName').value = name;
        document.getElementById('editCourtType').value = type;
        document.getElementById('editCourtPrice').value = price;
        document.getElementById('editCourtModal').classList.remove('hidden');
    }
    function closeEditModal() { document.getElementById('editCourtModal').classList.add('hidden'); }

    // --- 1. LẤY DỮ LIỆU TỪ BACKEND ---
    async function fetchAndRenderCourts() {
        try {
            const response = await fetch(API_URL);
            if (response.ok) {
                allCourtsData = await response.json();
                renderTable();
            }
        } catch (error) {
            console.error("Lỗi lấy danh sách sân: ", error);
        }
    }

    // --- 2. RENDER BẢNG & PHÂN TRANG ---
    function renderTable() {
        const tbody = document.getElementById('court-list');
        tbody.innerHTML = '';

        if (allCourtsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">Chưa có dữ liệu sân.</td></tr>`;
            document.getElementById('page-info').innerText = `Không có dữ liệu`;
            return;
        }

        const totalPages = Math.ceil(allCourtsData.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const displayCourts = allCourtsData.slice(startIndex, startIndex + rowsPerPage);

        const endIndex = Math.min(startIndex + rowsPerPage, allCourtsData.length);
        document.getElementById('page-info').innerText = `Hiển thị ${startIndex + 1} - ${endIndex} / Tổng ${allCourtsData.length} sân (Trang ${currentPage}/${totalPages})`;

        displayCourts.forEach(court => {
            const typeColor = court.type.toLowerCase().includes('bóng đá') ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700';
            const isChecked = court.is_active ? 'checked' : '';
            const formatPrice = new Intl.NumberFormat('vi-VN').format(court.price_per_hour) + ' đ';

            const tr = document.createElement('tr');
            tr.className = 'border-b hover:bg-gray-50 transition';
            tr.innerHTML = `
                <td class="py-3 px-4 text-gray-500 font-medium">${court.id}</td>
                <td class="py-3 px-6 font-semibold text-gray-900">${court.name}</td>
                <td class="py-3 px-6"><span class="${typeColor} px-2.5 py-1 rounded-md text-xs font-bold shadow-sm">${court.type}</span></td>
                <td class="py-3 px-6 font-semibold text-red-500">${formatPrice}</td>
                <td class="py-3 px-6 text-center">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer" ${isChecked} onchange="toggleActive(${court.id}, this)">
                        <div class="w-9 h-5 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500 shadow-sm"></div>
                    </label>
                </td>
                <td class="py-3 px-6 text-center text-blue-600 font-medium cursor-pointer hover:text-blue-800 transition"
                    onclick="openEditModal(${court.id}, '${court.name}', '${court.type}', ${court.price_per_hour})">
                    <i class="fa-solid fa-pen-to-square"></i> Sửa
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- HÀM NÚT ĐIỀU HƯỚNG TRANG ---
    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderTable();
        }
    }

    function nextPage() {
        const totalPages = Math.ceil(allCourtsData.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderTable();
        }
    }

    // --- 3. THÊM SÂN ---
    async function submitNewCourt(event) {
        event.preventDefault();
        const data = {
            name: document.getElementById('addCourtName').value,
            type: document.getElementById('addCourtType').value,
            price_per_hour: parseFloat(document.getElementById('addCourtPrice').value),
            is_active: true
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                alert("Đã thêm sân mới thành công!");
                closeAddModal();
                fetchAndRenderCourts();
            } else alert("Lỗi khi thêm");
        } catch (error) { alert("Lỗi mạng!"); }
    }

    // --- 4. SỬA THÔNG TIN SÂN ---
    async function submitEditCourt(event) {
        event.preventDefault();
        const courtId = document.getElementById('editCourtId').value;
        const data = {
            name: document.getElementById('editCourtName').value,
            type: document.getElementById('editCourtType').value,
            price_per_hour: parseFloat(document.getElementById('editCourtPrice').value)
        };

        try {
            const response = await fetch(`${API_URL}${courtId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                alert("Đã cập nhật thông tin sân thành công!");
                closeEditModal();
                fetchAndRenderCourts(); // Tải lại data mới nhất
            } else alert("Lỗi khi cập nhật");
        } catch (error) { alert("Lỗi mạng!"); }
    }

    // --- 5. BẬT/TẮT HOẠT ĐỘNG ---
    async function toggleActive(courtId, checkbox) {
        try {
            const response = await fetch(`${API_URL}${courtId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_active: checkbox.checked })
            });

            if (response.ok) {
                fetchAndRenderCourts();
            } else {
                checkbox.checked = !checkbox.checked;
                alert("Không thể cập nhật trạng thái");
            }
        } catch (error) {
            checkbox.checked = !checkbox.checked;
            alert("Lỗi kết nối");
        }
    }
    window.onload = () => {
        fetchAndRenderCourts();
        //setInterval(fetchAndRenderCourts, 10000);
    };
</script>
</body>
</html>
