<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

    <div class="max-w-full mx-auto bg-white p-6 rounded-lg shadow-md">
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-4 border-b pb-4 gap-4">
            <h1 class="text-xl font-bold text-gray-800 uppercase">
                <i class="fa-solid fa-calendar-days mr-2 text-blue-600"></i>Điều Phối Lịch Sân
            </h1>
            <div class="flex items-center space-x-3">
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase">Ngày xem lịch</label>
                    <input type="date" id="filterDate" onchange="fetchData()" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:ring-blue-500 font-medium cursor-pointer">
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase">Loại sân</label>
                    <select id="filterType" onchange="applyFilters()" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:ring-blue-500 font-medium cursor-pointer">
                        <option value="all">-- Tất cả --</option>
                        <option value="Bóng đá">Bóng đá</option>
                        <option value="Cầu lông">Cầu lông</option>
                        <option value="Tennis">Tennis</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- CHÚ THÍCH & PHÂN TRANG -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-4">
            <div class="flex space-x-4 text-sm font-medium">
                <div class="flex items-center"><span class="w-4 h-4 bg-gray-300 rounded-sm mr-2 shadow-sm border border-gray-400"></span> Đã qua giờ</div>
                <div class="flex items-center"><span class="w-4 h-4 bg-green-500 rounded-sm mr-2 shadow-sm"></span> Còn trống</div>
                <div class="flex items-center"><span class="w-4 h-4 bg-red-500 rounded-sm mr-2 shadow-sm"></span> Đã đặt</div>
                <div class="flex items-center"><span class="w-4 h-4 bg-yellow-500 rounded-sm mr-2 shadow-sm"></span> Đang chơi</div>
            </div>
            <div class="flex items-center space-x-2 mt-4 md:mt-0">
                <button onclick="prevPage()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-semibold transition"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="pageIndicator" class="text-sm font-medium text-gray-600">Trang 1 / 1</span>
                <button onclick="nextPage()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-semibold transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- BẢNG MA TRẬN CHÉO -->
        <div class="overflow-x-auto rounded-lg border border-gray-200 no-scrollbar">
            <table class="min-w-full bg-white text-sm table-fixed w-full">
                <thead>
                    <tr id="table-header" class="bg-gray-100 border-b text-center font-semibold text-gray-700">
                        <th class="py-3 px-4 border-r w-32 sticky left-0 bg-gray-100 z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">Khung giờ</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- 1. POPUP: ĐẶT SÂN / VÃNG LAI (Xanh -> Đỏ/Vàng) -->
    <div id="bookingModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 overflow-y-auto h-full w-full z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="p-6 border w-96 shadow-xl rounded-xl bg-white">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-gray-900">Mở Đơn Đặt Sân</h3>
                <button onclick="closeBookingModal()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <p class="text-sm text-gray-500 mb-4">Khung giờ: <strong id="bookingTime" class="text-blue-600"></strong> tại <strong id="bookingCourt" class="text-gray-800"></strong></p>

            <form id="bookingForm" onsubmit="confirmBooking(event)">
                <input type="hidden" id="bookingCourtId">

                <div class="mb-3">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tên khách hàng *</label>
                    <input type="text" id="customerName" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500" placeholder="Nhập tên khách...">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Số điện thoại *</label>
                    <input type="text" id="customerPhone" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500" placeholder="Nhập SĐT...">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Loại hình đặt</label>
                    <select id="bookingStatus" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 font-medium">
                        <option value="booked">Khách đặt trước</option>
                        <option value="playing">Khách vào chơi luôn</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeBookingModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg">Hủy</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md">Tạo Đơn</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. POPUP: CHI TIẾT & HÀNH ĐỘNG (Đỏ / Vàng) -->
    <div id="detailModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 overflow-y-auto h-full w-full z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="p-6 border w-[400px] shadow-xl rounded-xl bg-white">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-gray-800">Quản lý Booking</h3>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="space-y-3 text-sm text-gray-600 mb-6">
                <div class="flex justify-between"><span class="font-medium">Mã Đơn:</span> <span id="detailCode" class="font-bold text-blue-600"></span></div>
                <div class="flex justify-between"><span class="font-medium">Khách hàng:</span> <span id="detailName" class="font-semibold text-gray-900"></span></div>
                <div class="flex justify-between"><span class="font-medium">SĐT:</span> <span id="detailPhone" class="font-semibold text-gray-900"></span></div>
                <div class="flex justify-between"><span class="font-medium">Trạng thái:</span> <span id="detailStatus" class="px-2 py-0.5 rounded text-xs font-bold"></span></div>
            </div>

            <!-- Nút Hành Động -->
            <div class="flex flex-col space-y-3">
                <!-- Nút Check-in (chỉ hiện khi Đỏ) -->
                <button id="btnCheckIn" onclick="updateBookingStatus('playing')" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2.5 rounded-lg shadow-md transition hidden">
                    <i class="fa-solid fa-check-to-slot mr-1"></i> Khách Vào Chơi
                </button>

                <!-- Nút Hoàn Thành (chỉ hiện khi Vàng) -->
                <button id="btnComplete" onclick="completeBooking()" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2.5 rounded-lg shadow-md transition hidden">
                    <i class="fa-solid fa-check mr-1"></i> Hoàn Thành
                </button>

                <!-- Nút Hủy (Đỏ & Vàng đều hiện) -->
                <button id="btnCancelBooking" onclick="cancelBooking()" class="w-full bg-gray-100 hover:bg-red-100 text-red-600 font-semibold py-2.5 rounded-lg transition hidden">
                    Hủy Đơn
                </button>
            </div>
        </div>
    </div>

<script>
    const API_COURTS = 'http://127.0.0.1:8000/api/v1/courts/';
    const API_BOOKINGS = 'http://127.0.0.1:8000/api/v1/bookings';

    const DEFAULT_HOURS = [
        "06:00", "07:00", "08:00", "09:00", "10:00", "11:00",
        "12:00", "13:00", "14:00", "15:00", "16:00", "17:00",
        "18:00", "19:00", "20:00", "21:00", "22:00"
    ];

    let allCourts = [], filteredCourts = [], bookedSlots = [];
    let currentPage = 1; const courtsPerPage = 4;
    let currentSlotInfo = null;

    function setDefaultDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('filterDate').value = `${yyyy}-${mm}-${dd}`;
    }

    async function fetchData() {
        const selectedDate = document.getElementById('filterDate').value;
        try {
            const resCourts = await fetch(API_COURTS);
            if (resCourts.ok) allCourts = (await resCourts.json()).filter(c => c.is_active === true);
        } catch (e) {}

        if (allCourts.length > 0 && selectedDate) {
            try {
                const resSchedule = await fetch(`${API_BOOKINGS}/schedule?date=${selectedDate}`);
                if (resSchedule.ok) bookedSlots = await resSchedule.json();
                else bookedSlots = [];
            } catch (e) { bookedSlots = []; }
        } else bookedSlots = [];
        applyFilters();
    }

    function applyFilters() {
        const typeFilter = document.getElementById('filterType').value;
        filteredCourts = typeFilter === 'all' ? [...allCourts] : allCourts.filter(c => c.type.toLowerCase().includes(typeFilter.toLowerCase()));
        currentPage = 1;
        renderTable();
    }

    function nextPage() { if (currentPage < Math.ceil(filteredCourts.length / courtsPerPage)) { currentPage++; renderTable(); } }
    function prevPage() { if (currentPage > 1) { currentPage--; renderTable(); } }

    function renderTable() {
        const thead = document.getElementById('table-header');
        const tbody = document.getElementById('table-body');
        document.getElementById('pageIndicator').innerText = `Trang ${currentPage} / ${Math.ceil(filteredCourts.length / courtsPerPage) || 1}`;

        const displayCourts = filteredCourts.slice((currentPage - 1) * courtsPerPage, currentPage * courtsPerPage);

        thead.innerHTML = '<th class="py-3 px-4 border-r w-32 sticky left-0 bg-gray-100 z-10 shadow">Khung giờ</th>';
        displayCourts.forEach(court => {
            thead.innerHTML += `<th class="py-3 px-4 border-r text-center w-48">${court.name}<br><span class="text-xs text-gray-500">(${court.type})</span></th>`;
        });

        tbody.innerHTML = '';
        if (displayCourts.length === 0) return;

        const now = new Date();
        const selectedDate = document.getElementById('filterDate').value;
        const [y, m, d] = selectedDate.split('-');

        for (let i = 0; i < DEFAULT_HOURS.length - 1; i++) {
            const startTime = DEFAULT_HOURS[i], endTime = DEFAULT_HOURS[i+1];
            const tr = document.createElement('tr');
            tr.className = 'border-b hover:bg-gray-50';
            tr.innerHTML = `<td class="py-3 px-4 border-r font-semibold text-gray-700 sticky left-0 bg-white z-10 shadow">${startTime} - ${endTime}</td>`;

            const [endHr, endMin] = endTime.split(':');
            const slotEndDateTime = new Date(y, m - 1, d, endHr, endMin);
            const cutoffTime = new Date(slotEndDateTime.getTime() - 10 * 60000);
            const isPastHour = now >= cutoffTime;

            displayCourts.forEach(court => {
                const slotInfo = bookedSlots.find(s => s.court_id === court.id && s.start_time === startTime && s.status !== 'canceled');
                let btnHtml = '';

                if (!slotInfo) {
                    if (isPastHour) {
                        btnHtml = `<button disabled class="w-full h-10 bg-gray-200 text-gray-400 font-semibold rounded shadow-sm text-sm cursor-not-allowed border border-gray-300">Đã qua giờ</button>`;
                    } else {
                        btnHtml = `<button onclick="openBookingModal(${court.id}, '${court.name}', '${startTime} - ${endTime}')" class="w-full h-10 bg-green-500 hover:bg-green-600 text-white font-semibold rounded shadow-sm text-sm">Trống</button>`;
                    }
                } else if (slotInfo.status === 'booked') {
                    const dataStr = JSON.stringify(slotInfo).replace(/"/g, '&quot;');
                    btnHtml = `<button onclick="openDetailModal(${dataStr})" class="w-full h-10 bg-red-500 hover:bg-red-600 text-white font-semibold rounded shadow-sm text-sm truncate px-1">${slotInfo.customer}</button>`;
                } else if (slotInfo.status === 'playing') {
                    const dataStr = JSON.stringify(slotInfo).replace(/"/g, '&quot;');
                    btnHtml = `<button onclick="openDetailModal(${dataStr})" class="w-full h-10 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded shadow-sm text-sm">Đang chơi</button>`;
                }

                tr.innerHTML += `<td class="p-2 border-r text-center align-middle">${btnHtml}</td>`;
            });
            tbody.appendChild(tr);
        }
    }

    setInterval(fetchData, 10000);

    // --- XỬ LÝ ĐẶT SÂN ---
    function openBookingModal(courtId, courtName, timeSlot) {
        document.getElementById('bookingCourt').innerText = courtName;
        document.getElementById('bookingTime').innerText = timeSlot;
        document.getElementById('bookingCourtId').value = courtId;
        document.getElementById('bookingForm').reset();
        document.getElementById('bookingModal').classList.remove('hidden');
    }
    function closeBookingModal() { document.getElementById('bookingModal').classList.add('hidden'); }

    async function confirmBooking(event) {
        event.preventDefault();
        const payload = {
            court_id: parseInt(document.getElementById('bookingCourtId').value),
            booking_date: document.getElementById('filterDate').value,
            start_time: document.getElementById('bookingTime').innerText.split(' - ')[0],
            end_time: document.getElementById('bookingTime').innerText.split(' - ')[1],
            customer_name: document.getElementById('customerName').value,
            customer_phone: document.getElementById('customerPhone').value,
            status: document.getElementById('bookingStatus').value
        };

        try {
            const res = await fetch(`${API_BOOKINGS}/`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            if (res.ok) { closeBookingModal(); fetchData(); }
            else alert("Lỗi hệ thống");
        } catch (error) { alert("Lỗi mạng!"); }
    }

    // --- XỬ LÝ ĐƠN ---
    function openDetailModal(slotInfo) {
        currentSlotInfo = slotInfo;
        document.getElementById('detailCode').innerText = slotInfo.booking_code;
        document.getElementById('detailName').innerText = slotInfo.customer;
        document.getElementById('detailPhone').innerText = slotInfo.phone;

        const typeEl = document.getElementById('detailStatus');
        const btnCheckIn = document.getElementById('btnCheckIn');
        const btnComplete = document.getElementById('btnComplete');
        const btnCancel = document.getElementById('btnCancelBooking');

        // Ẩn tất cả nút trước khi xét
        btnCheckIn.classList.add('hidden');
        btnComplete.classList.add('hidden');
        btnCancel.classList.add('hidden');

        if (slotInfo.status === 'booked') {
            typeEl.innerText = "Đã đặt trước";
            typeEl.className = "px-2 py-1 rounded text-xs font-bold bg-red-100 text-red-700";

            // Đỏ -> Hiện nút Vào Chơi và Nút Hủy
            btnCheckIn.classList.remove('hidden');
            btnCancel.classList.remove('hidden');

        } else if (slotInfo.status === 'playing') {
            typeEl.innerText = "Khách đang chơi";
            typeEl.className = "px-2 py-1 rounded text-xs font-bold bg-yellow-100 text-yellow-700";

            // Vàng -> Hiện nút Hoàn Thành và Nút Hủy
            btnComplete.classList.remove('hidden');
            btnCancel.classList.remove('hidden');
        }

        document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
        document.getElementById('detailModal').classList.add('hidden');
        currentSlotInfo = null;
    }

    // HÀM: Đổi status thành Playing (Đỏ -> Vàng)
    async function updateBookingStatus(newStatus) {
        try {
            const res = await fetch(`${API_BOOKINGS}/${currentSlotInfo.booking_code}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            if(res.ok) { closeDetailModal(); fetchData(); }
            else { alert("Không thể cập nhật trạng thái"); }
        } catch (e) { alert("Lỗi kết nối"); }
    }

    // HÀM: Nút Hoàn Thành
    async function completeBooking() {
        if(confirm("Hoàn thành đơn.")) {
            try {
                // Tận dụng API Delete (Xóa Slot, giữ History)
                const res = await fetch(`${API_BOOKINGS}/${currentSlotInfo.booking_code}`, { method: 'DELETE' });
                if(res.ok) { closeDetailModal(); fetchData(); }
            } catch (e) { alert("Lỗi kết nối"); }
        }
    }

    // HÀM: Nút Hủy Đơn
    async function cancelBooking() {
        if(confirm("Xác nhận KHÁCH KHÔNG ĐẾN hoặc HỦY?")) {
            try {
                const res = await fetch(`${API_BOOKINGS}/${currentSlotInfo.booking_code}`, { method: 'DELETE' });
                if(res.ok) { closeDetailModal(); fetchData(); }
            } catch (e) { alert("Lỗi mạng!"); }
        }
    }

    window.onload = () => { setDefaultDate(); fetchData(); };
</script>
</body>
</html>
