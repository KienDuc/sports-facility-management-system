<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

    <div class="max-w-full mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-gray-800">
                <i class="fa-solid fa-concierge-bell mr-2 text-blue-600"></i>Danh Sách Dịch Vụ
            </h1>
            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 px-4 rounded shadow transition">
                + Thêm Dịch Vụ Mới
            </button>
        </div>

        <div class="rounded-lg border border-gray-200 shadow-sm flex flex-col">
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b text-left font-semibold text-gray-600">
                            <th class="py-3 px-4 w-16">ID</th>
                            <th class="py-3 px-6">Tên Dịch Vụ</th>
                            <th class="py-3 px-6 w-32">Đơn Vị Tính</th>
                            <th class="py-3 px-6 w-40">Đơn Giá</th>
                            <th class="py-3 px-6 text-center w-32">Đang Cung Cấp</th>
                            <th class="py-3 px-6 text-center w-24">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="service-list">

                    </tbody>
                </table>
            </div>

            <!-- KHU VỰC PHÂN TRANG -->
            <div class="flex justify-between items-center p-4 border-t border-gray-200 bg-gray-50 rounded-b-lg">
                <span id="page-info" class="text-sm text-gray-600 font-medium"></span>
                <div class="flex space-x-2">
                    <button onclick="prevPage()" class="px-4 py-1.5 bg-white border border-gray-300 hover:bg-gray-100 rounded shadow-sm text-sm font-semibold transition text-gray-700">Trước</button>
                    <button onclick="nextPage()" class="px-4 py-1.5 bg-white border border-gray-300 hover:bg-gray-100 rounded shadow-sm text-sm font-semibold transition text-gray-700">Sau</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM DỊCH VỤ MỚI -->
    <div id="addServiceModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="p-6 border w-96 shadow-xl rounded-xl bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-bold text-gray-900 mb-4">Thêm Dịch Vụ Mới</h3>
                <form id="addServiceForm" onsubmit="submitNewService(event)" class="text-left">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tên Dịch Vụ</label>
                        <input type="text" id="addServiceName" required class="w-full border border-gray-300 rounded-md py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="VD: Nước suối Aquafina">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Đơn Vị Tính</label>
                        <select id="addServiceUnit" class="w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm focus:ring-blue-500 font-medium">
                            <option value="Lượt">Lượt</option>
                            <option value="Chai">Chai</option>
                            <option value="Lon">Lon</option>
                            <option value="Cái">Cái</option>
                            <option value="Bộ">Bộ</option>
                            <option value="Giờ">Giờ</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Đơn Giá (VNĐ)</label>
                        <input type="number" id="addServicePrice" required min="1" class="w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm focus:ring-blue-500">
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeAddModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg shadow-sm transition">Hủy</button>
                        <button type="submit" id="btnAddSubmit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition">Lưu Dịch Vụ</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL SỬA DỊCH VỤ -->
    <div id="editServiceModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="p-6 border w-96 shadow-xl rounded-xl bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-bold text-gray-900 mb-4">Chỉnh Sửa Dịch Vụ</h3>
                <form id="editServiceForm" onsubmit="submitEditService(event)" class="text-left">
                    <input type="hidden" id="editServiceId">

                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tên Dịch Vụ</label>
                        <input type="text" id="editServiceName" required class="w-full border border-gray-300 rounded-md py-2 px-3 focus:ring-blue-500 sm:text-sm">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Đơn Vị Tính</label>
                        <select id="editServiceUnit" class="w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm focus:ring-blue-500 font-medium">
                            <option value="Lượt">Lượt</option>
                            <option value="Chai">Chai</option>
                            <option value="Lon">Lon</option>
                            <option value="Cái">Cái</option>
                            <option value="Bộ">Bộ</option>
                            <option value="Giờ">Giờ</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Đơn Giá (VNĐ)</label>
                        <input type="number" id="editServicePrice" required min="1" class="w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm focus:ring-blue-500">
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeEditModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg shadow-sm transition">Hủy</button>
                        <button type="submit" id="btnEditSubmit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition">Cập Nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script>
    // --- CẤU HÌNH BIẾN TOÀN CỤC CHO PHÂN TRANG ---
    const API_URL = 'http://127.0.0.1:8000/api/v1/services/';
    let allServicesData = [];
    let currentPage = 1;
    const rowsPerPage = 8;

    // --- MODAL THÊM ---
    function openAddModal() { document.getElementById('addServiceModal').classList.remove('hidden'); }
    function closeAddModal() {
        document.getElementById('addServiceModal').classList.add('hidden');
        document.getElementById('addServiceForm').reset();
    }

    // --- MODAL SỬA ---
    function openEditModal(id, name, unit, price) {
        document.getElementById('editServiceId').value = id;
        document.getElementById('editServiceName').value = name;
        document.getElementById('editServiceUnit').value = unit;
        document.getElementById('editServicePrice').value = price;
        document.getElementById('editServiceModal').classList.remove('hidden');
    }
    function closeEditModal() { document.getElementById('editServiceModal').classList.add('hidden'); }

    // --- 1. LẤY DỮ LIỆU TỪ BACKEND ---
    async function fetchAndRenderServices() {
        try {
            const response = await fetch(API_URL);
            if (response.ok) {
                allServicesData = await response.json();
                renderTable();
            }
        } catch (error) {
            console.error("Lỗi lấy danh sách dịch vụ: ", error);
        }
    }

    // --- 2. RENDER BẢNG & PHÂN TRANG ---
    function renderTable() {
        const tbody = document.getElementById('service-list');
        tbody.innerHTML = '';

        if (allServicesData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">Chưa có dữ liệu dịch vụ.</td></tr>`;
            document.getElementById('page-info').innerText = `Không có dữ liệu`;
            return;
        }

        const totalPages = Math.ceil(allServicesData.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const displayServices = allServicesData.slice(startIndex, startIndex + rowsPerPage);

        const endIndex = Math.min(startIndex + rowsPerPage, allServicesData.length);
        document.getElementById('page-info').innerText = `Hiển thị ${startIndex + 1} - ${endIndex} / Tổng ${allServicesData.length} dịch vụ (Trang ${currentPage}/${totalPages})`;

        displayServices.forEach(service => {
            const isChecked = service.is_available ? 'checked' : '';
            const formatPrice = new Intl.NumberFormat('vi-VN').format(service.price) + ' đ';
            const safeName = service.name.replace(/'/g, "\\'");

            const tr = document.createElement('tr');
            tr.className = 'border-b hover:bg-gray-50 transition';
            tr.innerHTML = `
                <td class="py-3 px-4 text-gray-500 font-medium">${service.id}</td>
                <td class="py-3 px-6 font-semibold text-gray-900">${service.name}</td>
                <td class="py-3 px-6"><span class="bg-blue-100 text-blue-700 px-2.5 py-1 rounded-md text-xs font-bold shadow-sm">${service.unit}</span></td>
                <td class="py-3 px-6 font-semibold text-red-500">${formatPrice}</td>
                <td class="py-3 px-6 text-center">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer" ${isChecked} onchange="toggleAvailable(${service.id}, this)">
                        <div class="w-9 h-5 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500 shadow-sm"></div>
                    </label>
                </td>
                <td class="py-3 px-6 text-center text-blue-600 font-medium cursor-pointer hover:text-blue-800 transition"
                    onclick="openEditModal(${service.id}, '${safeName}', '${service.unit}', ${service.price})">
                    <i class="fa-solid fa-pen-to-square"></i> Sửa
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- HÀM NÚT ĐIỀU HƯỚNG TRANG ---
    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderTable();
        }
    }

    function nextPage() {
        const totalPages = Math.ceil(allServicesData.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderTable();
        }
    }

    // --- 3. THÊM DỊCH VỤ ---
    async function submitNewService(event) {
        event.preventDefault();
        const data = {
            name: document.getElementById('addServiceName').value,
            unit: document.getElementById('addServiceUnit').value,
            price: parseFloat(document.getElementById('addServicePrice').value),
            is_available: true
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                alert("Đã thêm dịch vụ mới thành công!");
                closeAddModal();
                fetchAndRenderServices();
            } else alert("Lỗi khi thêm");
        } catch (error) { alert("Lỗi mạng!"); }
    }

    // --- 4. SỬA THÔNG TIN DỊCH VỤ ---
    async function submitEditService(event) {
        event.preventDefault();
        const serviceId = document.getElementById('editServiceId').value;
        const data = {
            name: document.getElementById('editServiceName').value,
            unit: document.getElementById('editServiceUnit').value,
            price: parseFloat(document.getElementById('editServicePrice').value)
        };

        try {
            const response = await fetch(`${API_URL}${serviceId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                alert("Đã cập nhật dịch vụ thành công!");
                closeEditModal();
                fetchAndRenderServices(); // Tải lại data mới nhất
            } else alert("Lỗi khi cập nhật");
        } catch (error) { alert("Lỗi mạng!"); }
    }

    // --- 5. BẬT/TẮT TRẠNG THÁI CUNG CẤP ---
    async function toggleAvailable(serviceId, checkbox) {
        try {
            const response = await fetch(`${API_URL}${serviceId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_available: checkbox.checked })
            });

            if (response.ok) {
                fetchAndRenderServices();
            } else {
                checkbox.checked = !checkbox.checked;
                alert("Không thể cập nhật trạng thái");
            }
        } catch (error) {
            checkbox.checked = !checkbox.checked;
            alert("Lỗi kết nối");
        }
    }

    window.onload = () => {
        fetchAndRenderServices();
    };
</script>
</body>
</html>
