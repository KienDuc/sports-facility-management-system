<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

    <div class="max-w-full mx-auto bg-white p-6 rounded-lg shadow-md">
        <!-- HEADER -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-gray-800">
                <i class="fa-solid fa-clipboard-list mr-2 text-blue-600"></i>Danh Sách Đơn Đặt &amp; Tra Cứu Booking
            </h1>
            <button onclick="fetchAndRenderBookings()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold py-2 px-4 rounded shadow-sm transition">
                <i class="fa-solid fa-rotate-right mr-1"></i> Làm mới
            </button>
        </div>

        <!-- THANH TRA CỨU / BỘ LỌC -->
        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-5">
            <form id="searchForm" onsubmit="searchBookings(event)" class="flex flex-wrap items-end gap-3">
                <div class="flex flex-col flex-1 min-w-[220px]">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Tra cứu (Mã đơn / Tên KH / SĐT)</label>
                    <input type="text" id="filterKeyword" placeholder="VD: BK1755... hoặc Nguyễn Văn A hoặc 09xx..."
                           class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Trạng thái</label>
                    <select id="filterStatus" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-blue-500 font-medium cursor-pointer">
                        <option value="all">-- Tất cả --</option>
                        <option value="booked">Đã đặt trước</option>
                        <option value="playing">Đang chơi</option>
                        <option value="canceled">Đã hủy / Hoàn tất</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Từ ngày</label>
                    <input type="date" id="filterDateFrom" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Đến ngày</label>
                    <input type="date" id="filterDateTo" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-blue-500 cursor-pointer">
                </div>

                <div class="flex gap-2">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 px-4 rounded-md shadow transition">
                        <i class="fa-solid fa-magnifying-glass mr-1"></i> Tìm kiếm
                    </button>
                    <button type="button" onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-semibold py-2 px-4 rounded-md shadow-sm transition">
                        Xóa lọc
                    </button>
                </div>
            </form>
        </div>

        <!-- BẢNG DANH SÁCH -->
        <div class="rounded-lg border border-gray-200 shadow-sm flex flex-col">
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b text-left font-semibold text-gray-600">
                            <th class="py-3 px-4 w-16">ID</th>
                            <th class="py-3 px-6">Mã Đơn</th>
                            <th class="py-3 px-6">Khách Hàng</th>
                            <th class="py-3 px-6">SĐT</th>
                            <th class="py-3 px-6">Ngày Đặt</th>
                            <th class="py-3 px-6">Sân / Khung Giờ</th>
                            <th class="py-3 px-6">Tổng Tiền</th>
                            <th class="py-3 px-6 text-center">Trạng Thái</th>
                            <th class="py-3 px-6 text-center w-28">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="booking-list"></tbody>
                </table>
            </div>

            <!-- KHU VỰC PHÂN TRANG -->
            <div class="flex justify-between items-center p-4 border-t border-gray-200 bg-gray-50 rounded-b-lg">
                <span id="page-info" class="text-sm text-gray-600 font-medium"></span>
                <div class="flex space-x-2">
                    <button onclick="prevPage()" class="px-4 py-1.5 bg-white border border-gray-300 hover:bg-gray-100 rounded shadow-sm text-sm font-semibold transition text-gray-700">Trước</button>
                    <button onclick="nextPage()" class="px-4 py-1.5 bg-white border border-gray-300 hover:bg-gray-100 rounded shadow-sm text-sm font-semibold transition text-gray-700">Sau</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: CHI TIẾT ĐƠN ĐẶT -->
    <div id="detailModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 overflow-y-auto h-full w-full z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="p-6 border w-[480px] max-h-[85vh] overflow-y-auto shadow-xl rounded-xl bg-white">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-gray-800">Chi Tiết Đơn Đặt</h3>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="space-y-2 text-sm text-gray-600 mb-4">
                <div class="flex justify-between"><span class="font-medium">Mã Đơn:</span> <span id="detailCode" class="font-bold text-blue-600"></span></div>
                <div class="flex justify-between"><span class="font-medium">Khách hàng:</span> <span id="detailName" class="font-semibold text-gray-900"></span></div>
                <div class="flex justify-between"><span class="font-medium">SĐT:</span> <span id="detailPhone" class="font-semibold text-gray-900"></span></div>
                <div class="flex justify-between"><span class="font-medium">Ngày đặt:</span> <span id="detailDate" class="font-semibold text-gray-900"></span></div>
                <div class="flex justify-between"><span class="font-medium">Thời gian tạo:</span> <span id="detailCreatedAt" class="font-semibold text-gray-900"></span></div>
                <div class="flex justify-between items-center"><span class="font-medium">Trạng thái:</span> <span id="detailStatus" class="px-2 py-0.5 rounded text-xs font-bold"></span></div>
                <div class="flex justify-between"><span class="font-medium">Tổng tiền:</span> <span id="detailTotal" class="font-bold text-red-500"></span></div>
                <div id="detailNoteWrap" class="pt-1"><span class="font-medium">Ghi chú:</span> <span id="detailNote" class="text-gray-700"></span></div>
            </div>

            <div class="mb-4">
                <h4 class="text-sm font-bold text-gray-700 mb-2 border-t pt-3"><i class="fa-solid fa-vector-square mr-1 text-blue-500"></i>Sân &amp; Khung Giờ</h4>
                <table class="w-full text-xs border border-gray-200 rounded overflow-hidden">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="py-2 px-2 text-left">Sân</th>
                            <th class="py-2 px-2 text-left">Khung Giờ</th>
                            <th class="py-2 px-2 text-right">Giá</th>
                        </tr>
                    </thead>
                    <tbody id="detailSlots"></tbody>
                </table>
            </div>

            <div class="mb-2">
                <h4 class="text-sm font-bold text-gray-700 mb-2 border-t pt-3"><i class="fa-solid fa-concierge-bell mr-1 text-blue-500"></i>Dịch Vụ Đi Kèm</h4>
                <table class="w-full text-xs border border-gray-200 rounded overflow-hidden">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="py-2 px-2 text-left">Dịch vụ</th>
                            <th class="py-2 px-2 text-center">SL</th>
                            <th class="py-2 px-2 text-right">Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody id="detailServices"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const API_URL = 'http://127.0.0.1:8000/api/v1/bookings/';

    let allBookingsData = [];
    let currentPage = 1;
    const rowsPerPage = 8;

    // --- 1. LẤY DỮ LIỆU TỪ BACKEND (có hỗ trợ tra cứu / lọc) ---
    async function fetchAndRenderBookings() {
        const params = new URLSearchParams();
        const keyword = document.getElementById('filterKeyword').value.trim();
        const statusVal = document.getElementById('filterStatus').value;
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;

        if (keyword) params.append('keyword', keyword);
        if (statusVal && statusVal !== 'all') params.append('status', statusVal);
        if (dateFrom) params.append('date_from', dateFrom);
        if (dateTo) params.append('date_to', dateTo);

        try {
            const response = await fetch(`${API_URL}?${params.toString()}`);
            if (response.ok) {
                allBookingsData = await response.json();
                currentPage = 1;
                renderTable();
            } else {
                alert("Lỗi khi tải danh sách đơn đặt");
            }
        } catch (error) {
            console.error("Lỗi lấy danh sách đơn đặt: ", error);
        }
    }

    function searchBookings(event) {
        event.preventDefault();
        fetchAndRenderBookings();
    }

    function resetFilters() {
        document.getElementById('searchForm').reset();
        fetchAndRenderBookings();
    }

    // --- 2. RENDER BẢNG & PHÂN TRANG ---
    function statusBadge(status) {
        const map = {
            booked: { text: 'Đã đặt trước', cls: 'bg-red-100 text-red-700' },
            playing: { text: 'Đang chơi', cls: 'bg-yellow-100 text-yellow-700' },
            canceled: { text: 'Đã hủy / Hoàn tất', cls: 'bg-gray-200 text-gray-600' },
            cancelled: { text: 'Đã hủy / Hoàn tất', cls: 'bg-gray-200 text-gray-600' },
            completed: { text: 'Hoàn tất', cls: 'bg-green-100 text-green-700' },
            confirmed: { text: 'Đã xác nhận', cls: 'bg-blue-100 text-blue-700' },
        };
        return map[status] || { text: status, cls: 'bg-gray-100 text-gray-600' };
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('vi-VN').format(value || 0) + ' đ';
    }

    function renderTable() {
        const tbody = document.getElementById('booking-list');
        tbody.innerHTML = '';

        if (allBookingsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-gray-500">Không tìm thấy đơn đặt nào.</td></tr>`;
            document.getElementById('page-info').innerText = `Không có dữ liệu`;
            return;
        }

        const totalPages = Math.ceil(allBookingsData.length / rowsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const displayBookings = allBookingsData.slice(startIndex, startIndex + rowsPerPage);

        const endIndex = Math.min(startIndex + rowsPerPage, allBookingsData.length);
        document.getElementById('page-info').innerText = `Hiển thị ${startIndex + 1} - ${endIndex} / Tổng ${allBookingsData.length} đơn (Trang ${currentPage}/${totalPages})`;

        displayBookings.forEach(booking => {
            const badge = statusBadge(booking.status);
            const slotsText = (booking.slots || []).map(s => `${s.court_name || ''} (${s.start_time}-${s.end_time})`).join(', ') || '—';

            const tr = document.createElement('tr');
            tr.className = 'border-b hover:bg-gray-50 transition';
            tr.innerHTML = `
                <td class="py-3 px-4 text-gray-500 font-medium">${booking.id}</td>
                <td class="py-3 px-6 font-bold text-blue-600">${booking.booking_code}</td>
                <td class="py-3 px-6 font-semibold text-gray-900">${booking.customer_name}</td>
                <td class="py-3 px-6 text-gray-700">${booking.customer_phone}</td>
                <td class="py-3 px-6 text-gray-700">${booking.booking_date}</td>
                <td class="py-3 px-6 text-gray-700 max-w-[220px] truncate" title="${slotsText}">${slotsText}</td>
                <td class="py-3 px-6 font-semibold text-red-500">${formatCurrency(booking.total_price)}</td>
                <td class="py-3 px-6 text-center"><span class="${badge.cls} px-2.5 py-1 rounded-md text-xs font-bold shadow-sm">${badge.text}</span></td>
                <td class="py-3 px-6 text-center text-blue-600 font-medium cursor-pointer hover:text-blue-800 transition"
                    onclick='openDetailModal(${JSON.stringify(booking).replace(/'/g, "&#39;")})'>
                    <i class="fa-solid fa-eye"></i> Xem
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- HÀM NÚT ĐIỀU HƯỚNG TRANG ---
    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderTable();
        }
    }

    function nextPage() {
        const totalPages = Math.ceil(allBookingsData.length / rowsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderTable();
        }
    }

    // --- 3. MODAL CHI TIẾT ĐƠN ---
    function openDetailModal(booking) {
        document.getElementById('detailCode').innerText = booking.booking_code;
        document.getElementById('detailName').innerText = booking.customer_name;
        document.getElementById('detailPhone').innerText = booking.customer_phone;
        document.getElementById('detailDate').innerText = booking.booking_date;
        document.getElementById('detailCreatedAt').innerText = booking.created_at ? new Date(booking.created_at).toLocaleString('vi-VN') : '—';
        document.getElementById('detailTotal').innerText = formatCurrency(booking.total_price);

        const badge = statusBadge(booking.status);
        const statusEl = document.getElementById('detailStatus');
        statusEl.innerText = badge.text;
        statusEl.className = `px-2 py-0.5 rounded text-xs font-bold ${badge.cls}`;

        const noteWrap = document.getElementById('detailNoteWrap');
        if (booking.note) {
            noteWrap.classList.remove('hidden');
            document.getElementById('detailNote').innerText = booking.note;
        } else {
            noteWrap.classList.add('hidden');
        }

        const slotsBody = document.getElementById('detailSlots');
        slotsBody.innerHTML = (booking.slots && booking.slots.length > 0)
            ? booking.slots.map(s => `
                <tr class="border-t">
                    <td class="py-2 px-2">${s.court_name || '—'} <span class="text-gray-400">(${s.court_type || ''})</span></td>
                    <td class="py-2 px-2">${s.start_time} - ${s.end_time}</td>
                    <td class="py-2 px-2 text-right">${formatCurrency(s.price)}</td>
                </tr>`).join('')
            : `<tr><td colspan="3" class="py-2 px-2 text-center text-gray-400">Không có dữ liệu</td></tr>`;

        const servicesBody = document.getElementById('detailServices');
        servicesBody.innerHTML = (booking.services && booking.services.length > 0)
            ? booking.services.map(sv => `
                <tr class="border-t">
                    <td class="py-2 px-2">${sv.service_name || '—'}</td>
                    <td class="py-2 px-2 text-center">${sv.quantity}</td>
                    <td class="py-2 px-2 text-right">${formatCurrency(sv.total_price)}</td>
                </tr>`).join('')
            : `<tr><td colspan="3" class="py-2 px-2 text-center text-gray-400">Không có dịch vụ đi kèm</td></tr>`;

        document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
        document.getElementById('detailModal').classList.add('hidden');
    }

    window.onload = () => {
        fetchAndRenderBookings();
    };
</script>
</body>
</html>
