<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đặt Sân - Web Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-transition { transition: width 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

    <div class="flex h-screen w-full">

        <!-- SIDEBAR (Menu trái) -->
        <aside id="sidebar" class="w-64 bg-gray-900 text-white flex flex-col shadow-lg sidebar-transition flex-shrink-0 relative z-20">
            <!-- Logo -->
            <div class="h-16 flex items-center px-4 border-b border-gray-700 overflow-hidden" title="SFMS Admin">
                <div class="w-8 flex justify-center flex-shrink-0">
                    <i class="fa-solid fa-futbol text-green-400 text-2xl"></i>
                </div>
                <h1 class="text-xl font-bold uppercase tracking-wider text-green-400 ml-3 menu-text whitespace-nowrap transition-opacity duration-200">SFMS</h1>
            </div>

            <!-- Danh sách Menu -->
            <nav class="flex-1 py-4 overflow-y-auto overflow-x-hidden">

                <!-- MENU 1: Lịch Đặt & Khung Giờ -->
                <div class="px-2 mb-1">
                    <button onclick="loadPage('menu1_schedule.html', 'Lịch Đặt & Khung Giờ', this)" class="menu-btn w-full flex items-center px-2 py-3 bg-gray-800 text-white rounded-lg transition-colors text-left overflow-hidden" title="Lịch Đặt & Khung Giờ">
                        <div class="w-8 flex justify-center flex-shrink-0">
                            <i class="fa-solid fa-calendar-days text-xl"></i>
                        </div>
                        <span class="font-medium ml-3 menu-text whitespace-nowrap transition-opacity duration-200">Lịch Đặt & Khung Giờ</span>
                    </button>
                </div>

                <!-- MENU 3: Nhóm Quản Lý Sân & Dịch Vụ -->
                <div class="px-2 mb-1">
                    <button onclick="toggleSubMenu('submenu-courts', this)" class="w-full flex items-center px-2 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors text-left overflow-hidden" title="Quản lý Sân & Dịch vụ">
                        <div class="w-8 flex justify-center flex-shrink-0">
                            <i class="fa-solid fa-layer-group text-xl"></i>
                        </div>
                        <div class="flex-1 flex items-center justify-between ml-3 overflow-hidden menu-text transition-opacity duration-200">
                            <span class="font-medium whitespace-nowrap truncate">Quản lý Sân & Dịch vụ</span>
                            <i class="fa-solid fa-chevron-down text-xs transition-transform duration-300 flex-shrink-0" id="icon-submenu-courts"></i>
                        </div>
                    </button>

                    <!-- Sub-menu con -->
                    <div id="submenu-courts" class="submenu-container hidden flex-col pl-10 pr-2 mt-1 space-y-1">
                        <button onclick="loadPage('menu3_courts.html', 'Quản lý sân', this)" class="menu-btn w-full flex items-center px-2 py-2 text-sm text-gray-400 hover:text-white hover:bg-gray-800 rounded-md transition-colors text-left overflow-hidden" title="Quản lý sân">
                            <div class="w-6 flex justify-center flex-shrink-0">
                                <i class="fa-solid fa-vector-square text-sm"></i>
                            </div>
                            <span class="menu-text whitespace-nowrap ml-2 transition-opacity duration-200">Quản lý sân</span>
                        </button>
                    </div>
                </div>

                <!-- MENU 4: Thống kê nhanh -->
                <div class="px-2 mb-1">
                    <button onclick="loadPage('menu4_statistics.html', 'Thống kê nhanh', this)" class="menu-btn w-full flex items-center px-2 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors text-left overflow-hidden" title="Thống kê nhanh">
                        <div class="w-8 flex justify-center flex-shrink-0">
                            <i class="fa-solid fa-chart-line text-xl"></i>
                        </div>
                        <span class="font-medium ml-3 menu-text whitespace-nowrap transition-opacity duration-200">Thống kê nhanh</span>
                    </button>
                </div>
            </nav>

            <!-- User profile -->
            <div class="p-4 border-t border-gray-700 flex items-center overflow-hidden" title="Admin Sân">
                <div class="w-8 flex justify-center flex-shrink-0">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" alt="Avatar" class="w-8 h-8 rounded-full">
                </div>
                <div class="ml-3 menu-text whitespace-nowrap transition-opacity duration-200">
                    <p class="text-sm font-semibold">Admin Sân</p>
                    <p class="text-xs text-gray-400">Quản lý viên</p>
                </div>
            </div>
        </aside>

        <!-- CỘT PHẢI -->
        <div class="flex-1 flex flex-col h-screen min-w-0">

            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 z-10 flex-shrink-0">
                <div class="flex items-center">
                    <button onclick="toggleSidebar()" class="text-gray-500 hover:text-gray-700 focus:outline-none mr-4 p-2 rounded-md hover:bg-gray-100">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <div class="text-gray-500 font-medium truncate" id="page-title">
                        Quản lý / Lịch Đặt & Khung Giờ
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <button class="text-gray-500 hover:text-gray-700 relative">
                        <i class="fa-regular fa-bell text-xl"></i>
                        <span class="absolute top-0 right-0 -mt-1 -mr-1 flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                        </span>
                    </button>
                    <button class="bg-red-50 text-red-600 px-4 py-2 rounded-md text-sm font-medium hover:bg-red-100 transition whitespace-nowrap">
                        Đăng xuất
                    </button>
                </div>
            </header>

            <!-- NỘI DUNG CHÍNH -->
            <main class="flex-1 bg-gray-50 relative h-full">
                <iframe id="content-frame" src="menu1_schedule.html" class="w-full h-full border-none absolute inset-0"></iframe>
            </main>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const menuTexts = document.querySelectorAll('.menu-text');
            const submenus = document.querySelectorAll('.submenu-container');

            if (sidebar.classList.contains('w-64')) {
                submenus.forEach(sub => { sub.classList.add('hidden'); sub.classList.remove('flex'); });
                document.querySelectorAll('[id^="icon-submenu"]').forEach(icon => icon.classList.remove('rotate-180'));
                menuTexts.forEach(el => el.style.opacity = '0');
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-16');
                setTimeout(() => menuTexts.forEach(el => el.style.display = 'none'), 150);
            } else {
                sidebar.classList.remove('w-16');
                sidebar.classList.add('w-64');
                menuTexts.forEach(el => el.style.display = 'block');
                setTimeout(() => menuTexts.forEach(el => el.style.opacity = '1'), 50);
            }
        }

        function toggleSubMenu(menuId, btnElement) {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('w-16')) { toggleSidebar(); }
            setTimeout(() => {
                const submenu = document.getElementById(menuId);
                const icon = document.getElementById('icon-' + menuId);

                if (submenu.classList.contains('hidden')) {
                    submenu.classList.remove('hidden'); submenu.classList.add('flex');
                    icon.classList.add('rotate-180');
                } else {
                    submenu.classList.add('hidden'); submenu.classList.remove('flex');
                    icon.classList.remove('rotate-180');
                }
            }, sidebar.classList.contains('w-16') ? 300 : 0);
        }

        function loadPage(pageUrl, titleText, buttonElement) {
            const iframe = document.getElementById('content-frame');
            iframe.src = pageUrl + "?t=" + new Date().getTime();

            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.classList.remove('bg-gray-800', 'text-white');
                btn.classList.add('text-gray-400');
            });

            buttonElement.classList.remove('text-gray-400');
            buttonElement.classList.add('bg-gray-800', 'text-white');
            document.getElementById('page-title').innerText = "Quản lý / " + titleText;
        }
    </script>
</body>
</html>
